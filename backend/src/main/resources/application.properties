# ===============================
# SERVER
# ===============================
server.port=8080
spring.application.name=ecommerce-api

# ===============================
# DATABASE - POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================
jwt.secret=VeryStrongSecretKeyForJWTGenerationMustBeAtLeast32CharactersLong123
jwt.expiration=1800000

# ===============================
# SESSION
# ===============================
session.timeout.minutes=30

# ===============================
# STRIPE PAYMENT GATEWAY (TEST MODE)
# ===============================
# Get your test keys from: https://dashboard.stripe.com/test/apikeys
# Replace these with your own Stripe test keys
stripe.secret.key=<key>
stripe.publishable.key=<key>

# ===============================
# EMAIL (GMAIL SMTP)
# ===============================
# To use Gmail SMTP, you need to:
# 1. Enable 2-Step Verification in your Google Account
# 2. Create an App Password: https://myaccount.google.com/apppasswords
# 3. Replace the values below with your email and app password
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=<email>
spring.mail.password=<app_password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===============================
# OTP SETTINGS
# ===============================
otp.expiry.minutes=10

